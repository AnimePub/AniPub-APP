<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AniPub</title>
<style>
:root{--bg:#0a1424;--card:#11203a;--c2:#172b4d;--line:#22395f;--fg:#eaf3ff;--mut:#8fa6c8;--acc:#3d8bff;--lav:#9ec5ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 sans-serif}
body{padding-bottom:84px}
main{max-width:980px;margin:0 auto;padding:0 16px}
h2{font-size:21px;margin:26px 0 12px}h1{margin:0}
.mut{color:var(--mut);font-size:13px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:26px;padding:13px 20px;background:var(--acc);color:#041020;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.o{background:transparent;color:var(--lav);border:1.5px solid var(--line)}
button:disabled{opacity:.4}.full{width:100%}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:10px;outline:0}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);display:flex;justify-content:center;border-top:1px solid var(--line)}
#nav div{display:flex;width:100%;max-width:700px}
#nav a{flex:1;text-align:center;padding:10px 0 12px;color:var(--mut);text-decoration:none;font-size:12.5px}
#nav i{display:block;width:62px;height:32px;margin:0 auto 3px;border-radius:16px;padding:4px 19px}
#nav svg{width:24px;height:24px;fill:currentColor}
#nav a.on{color:var(--lav)}#nav a.on i{background:var(--c2)}
.hero{position:relative;height:60vh;min-height:360px;max-height:580px;margin:0 -16px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#000}
.track{display:flex;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.track.drag{transition:none}
.slide{flex:0 0 100%;position:relative;height:100%;background:#000 center 25%/cover no-repeat}
.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,20,36,.25) 0%,rgba(10,20,36,.15) 30%,rgba(10,20,36,.85) 72%,var(--bg) 100%)}
.sc{position:absolute;z-index:2;left:20px;right:20px;bottom:50px}
.sc h1{font-size:30px;line-height:1.12;margin:12px 0 6px;text-shadow:0 2px 12px #000}
.sc button{box-shadow:0 10px 24px rgba(61,139,255,.35)}
.brand{position:absolute;z-index:4;top:16px;left:20px;display:flex;align-items:center;font-size:23px;font-weight:700;text-shadow:0 2px 10px #000}
.brand svg{width:34px;height:40px;margin-right:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bdg{display:inline-flex;align-items:center;background:rgba(10,20,36,.75);border-radius:14px;padding:5px 12px;font-size:13px;font-weight:700}
.tag{display:inline-block;background:rgba(255,255,255,.14);color:var(--fg);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:600}
.gchip{display:inline-block;color:var(--lav);font-size:12.5px;font-weight:600;margin-right:10px}
.sd{font-size:14px;color:#d5e4ff;margin:10px 0 16px;max-width:600px;line-height:1.5;text-shadow:0 1px 6px #000;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dots{position:absolute;z-index:4;left:20px;bottom:18px;display:flex;align-items:center}
.dots b{display:inline-block;width:8px;height:8px;border-radius:4px;background:#ffffff66;margin-right:7px;cursor:pointer;transition:width .3s,background .3s}
.dots b.on{width:26px;background:var(--acc)}
.hs{display:flex;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;-webkit-overflow-scrolling:touch}.hs::-webkit-scrollbar{display:none}
.hs .pc{flex:none;width:112px;margin-right:12px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));grid-gap:16px 12px}
.pg>.mut,.pg>p,.pg>.err{grid-column:1/-1}
.pc{cursor:pointer}.pc .im{position:relative;padding-top:148%;border-radius:16px;overflow:hidden;background:var(--card)}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .bdg{position:absolute;top:8px;left:8px;padding:3px 9px;font-size:12px}
.pc .nm{font-size:13.5px;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sk{padding-top:148%;border-radius:16px;background:linear-gradient(90deg,var(--card) 25%,var(--c2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}@keyframes fi{from{opacity:0}to{opacity:1}}
.chips{display:flex;overflow-x:auto;padding:2px 0 10px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;margin-right:8px;padding:9px 16px;font-weight:500;background:var(--card);color:var(--fg);border:1px solid var(--line)}
.chips .on{background:var(--acc);color:#041020;border-color:var(--acc)}
.top{position:relative;margin:0 -16px;padding:16px 16px 4px;overflow:hidden}
.top:before{content:"";position:absolute;inset:-30px;background:var(--bi) center/cover;filter:blur(18px) brightness(.55);transform:scale(1.15)}
.top:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--bg))}
.top>*{position:relative;z-index:2}
.back{width:44px;height:44px;border-radius:50%;padding:0;background:rgba(10,20,36,.7);color:var(--fg);font-size:22px}
.dh{display:flex;margin-top:26px}.dh img{width:36%;max-width:220px;border-radius:16px;margin-right:16px;align-self:flex-start}
.dh h1{font-size:27px;line-height:1.2;margin-bottom:12px}.pill{display:inline-block;background:var(--c2);color:var(--lav);border-radius:16px;padding:7px 16px;font-size:14px;margin-left:8px}
.two{display:flex}.two>*{flex:1;margin-right:10px}.two>*:last-child{margin-right:0}
.gen{display:flex;overflow-x:auto;margin:16px 0}.gen::-webkit-scrollbar{display:none}.gen span{flex:none;background:var(--c2);color:var(--lav);padding:8px 18px;border-radius:20px;margin-right:8px;font-size:14px}
.desc{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;font-size:15.5px}.desc.x{display:block}
.link{color:var(--acc);font-weight:600;margin:8px 0 18px;display:inline-block}
.info{display:flex;padding:6px 0;color:var(--fg)}.info span{width:34%;color:var(--mut)}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));grid-gap:10px;margin-top:10px}
.eps button{border-radius:14px;padding:14px 0;background:var(--c2);color:var(--fg);font-weight:600;border:2px solid transparent;-webkit-user-select:none;user-select:none}
.eps .seen{color:var(--mut);background:var(--card)}.eps .cur{border-color:var(--acc)}
.row{display:flex;background:var(--card);border-radius:18px;padding:10px;margin-bottom:12px;cursor:pointer}
.row img{width:64px;height:92px;object-fit:cover;border-radius:12px;margin-right:14px;flex:none}.row>div{flex:1;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.stat{display:inline-block;width:48%;background:var(--card);border-radius:18px;padding:16px;margin:0 1% 10px;text-align:center}.stat b{display:block;font-size:24px;color:var(--acc)}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.vid{position:relative;padding-top:56.25%;background:#000;border-radius:16px;overflow:hidden}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid.fs{position:fixed;inset:0;padding:0;z-index:100;border-radius:0}
#brk{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px}
#brk div{background:var(--card);border-radius:24px;padding:26px;text-align:center;max-width:340px}
.err{background:#13284a;color:#b9d4ff;padding:12px;border-radius:12px;font-size:13px;word-break:break-word}
.stb{background:transparent;border:1.5px solid var(--line);color:var(--lav);border-radius:26px;margin:0;font-weight:600;text-align:center}
#offb{position:sticky;top:0;z-index:30;background:var(--c2);color:var(--lav);text-align:center;font-size:12.5px;padding:6px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--c2);color:var(--fg);padding:12px 20px;border-radius:22px;z-index:200;display:none;max-width:86%;text-align:center}

#nav{background:rgba(17,32,58,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.06);box-shadow:0 -8px 30px rgba(0,0,0,.35)}
#nav a{transition:color .2s}#nav a i{transition:background .25s}
.hs{scroll-snap-type:x proximity}.hs>*{scroll-snap-align:start}
.pc .im{box-shadow:0 12px 26px rgba(0,0,0,.4);transition:transform .25s}
.pc:active .im{transform:scale(.96)}
button{transition:transform .15s,opacity .2s,background .2s}button:active{transform:scale(.97)}
.row{transition:transform .15s}.row:active{transform:scale(.985)}
h2{letter-spacing:.2px}
input{transition:border-color .2s}input:focus{border-color:var(--acc)}

/*button layout*/
button{padding:12px 22px;min-height:48px;font-size:15px;line-height:1.2}
button.back{padding:0;min-height:44px}
.two{display:flex;gap:10px;align-items:stretch}
.two>*{flex:1 1 0;min-width:0;margin:0!important}
.two>button{white-space:normal;text-align:center;border-radius:999px;padding:12px 16px;min-height:50px}
.two>select,select.stb{flex:0 0 auto;width:auto;min-width:150px;max-width:55%;height:50px;min-height:50px;padding:0 40px 0 18px;border-radius:999px;font-size:15px;font-weight:600;appearance:none;-webkit-appearance:none;background-color:transparent;color:var(--lav);border:1.5px solid var(--line);background-image:linear-gradient(45deg,transparent 50%,var(--lav) 50%),linear-gradient(135deg,var(--lav) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
.two>select:focus,select.stb:focus{outline:0;border-color:var(--acc)}
.two>button.o{background:transparent}
input,select,textarea{padding:13px 16px}

:root{--bg:#0a1424;--card:#11203a;--c2:#172b4d;--line:#22395f;--fg:#eaf3ff;--mut:#8fa6c8;--acc:#3d8bff;--lav:#9ec5ff;--r:20px}
html,body{background:radial-gradient(900px 520px at 0% -8%,rgba(61,139,255,.22),transparent 60%),radial-gradient(800px 520px at 100% 0%,rgba(61,139,255,.12),transparent 55%),var(--bg);background-attachment:fixed;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{padding:0 18px}
h2{font-size:20px;font-weight:700;letter-spacing:.2px;margin:28px 0 14px}
.mut{font-size:13.5px;color:var(--mut)}
img{background:var(--card)}
button,.btn{min-height:50px;padding:14px 26px;border-radius:999px;font-size:15px;font-weight:700;letter-spacing:.2px;box-shadow:0 8px 22px rgba(61,139,255,.25)}
button.o{box-shadow:none;background:rgba(255,255,255,.04);border:1.5px solid var(--line);color:var(--lav)}
button:disabled{opacity:.5}
input,select,textarea{border-radius:16px;padding:15px 18px;min-height:52px;background:var(--card);border:1.5px solid var(--line);margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}

/* hero: no black, soft gradient instead */
.hero{background:var(--bg);margin:0 -18px;border-radius:0 0 28px 28px}
.slide{background-color:var(--card)}
.slide:after{background:linear-gradient(to bottom,rgba(10,20,36,.05) 0%,rgba(10,20,36,.25) 35%,rgba(10,20,36,.92) 76%,var(--bg) 100%)}
.sc{left:22px;right:22px;bottom:58px}
.sc h1{font-size:32px;font-weight:800}
.bdg{background:rgba(10,20,36,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tag{background:rgba(255,255,255,.1);font-weight:600;padding:5px 12px}
.dots{bottom:22px}
.brand{top:18px;left:22px}

/* bottom navigation */
#nav{background:rgba(17,32,58,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.06);box-shadow:0 -10px 30px rgba(0,0,0,.25)}
#nav a{font-weight:600}
#nav a.on{color:var(--fg)}
#nav a.on i{background:linear-gradient(135deg,rgba(61,139,255,.55),rgba(61,139,255,.55))}

/* cards, rows and rails */

var DL={};

function dlSource(id,ep,lang,pageUrl){
  var list=[];
  try{list=JSON.parse(Android.getStreams())}catch(e){}
  if(!list.length){toast("Press play on the episode first, then tap Download.");return Promise.resolve(null)}
  var s=list[list.length-1];
  return Promise.resolve({url:s.url,headers:s.headers||{}});
}
function startDl(id,ep,lang,pageUrl,title){
if(!(window.Android&&typeof Android.startDownload==="function")){toast("Downloads need the latest app build");return}
var have="";try{have=Android.findDownload(title,"EP"+ep+" "+lang.toUpperCase())}catch(z){}
if(have){toast("Already downloaded. Find it in Settings > Downloads");return}
dlSource(id,ep,lang,pageUrl).then(function(s){if(!s||!s.url){toast("Download source not set up yet (see dlSource in index.html)");return}
Android.startDownload(id+"-"+ep+"-"+lang,s.url,title,"EP"+ep+" "+lang.toUpperCase(),JSON.stringify(s.headers||{}));toast("Download started - find it in Settings > Downloads")}).catch(function(e){toast("Download failed: "+(e.message||e))})}
function fmtT(s){if(s<0||!isFinite(s))return"--";s=Math.round(s);if(s>=3600)return Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m";if(s>=60)return Math.floor(s/60)+"m "+s%60+"s";return s+"s"}
function dlHtml(){var k=Object.keys(DL);if(!k.length)return'<p class="mut">No downloads yet. Use the Download button in the player.</p>';
return k.map(function(x){var d=DL[x],run=d.status==="running";return'<div class="card"><div style="font-weight:600">'+esc(d.name)+'</div><div class="mut" style="margin:4px 0">'+(run?d.pct+"% \u00b7 "+(d.speed/1048576).toFixed(1)+" MB/s \u00b7 "+fmtT(d.eta)+" left":d.status==="done"?"Saved \u2713 "+esc(d.msg):d.status==="error"?"Failed: "+esc(d.msg):"Cancelled")+'</div>'+(run?'<div class="bar"><i style="width:'+d.pct+'%"></i></div><button class="o full" style="margin-top:10px" data-dc="'+esc(x)+'">Cancel download</button>':"")+"</div>"}).join("")}
function onDl(o){DL[o.key]=o;var e=$("dls");if(e)e.innerHTML=dlHtml();if(o.status==="done")toast("Downloaded: "+o.name);else if(o.status==="error")toast("Download failed: "+o.msg)}
